<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanTechPulse - Electronics Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 10px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 3px solid #38bdf8;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #f1f5f9;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HanTechPulse</h1>
            <p class="subtitle">የኤሌክትሮኒክስ እና የሃርድዌር መረጃዎች ማዕከል</p>
        </header>

        <div class="card">
            <h2>እንኳን ወደ HanTechPulse በደህና መጡ!</h2>
            <p>እዚህ ገጽ ላይ ስለ የተለያዩ የኤሌክትሮኒክስ ኮምፖነንቶች፣ ሰርኪዩቶች እና የሃርድዌር ፍተሻዎች አጠቃላይ መረጃዎችን ያገኛሉ።</p>
        </div>

        <div class="card">
            <h2>ቀጣይ የሚጨመሩ ይዘቶች</h2>
            <p>በቅርቡ የካፓሲተር፣ ሪዚስተር፣ ዳዮድ እና ሞስፌት መለኪያ መንገዶችን እና የሰርኪዩት ዲዛይኖችን እዚህ ገጽ ላይ እናካፍላለን።</p>
        </div>

        <footer>
            <p>&copy; 2026 HanTechPulse | የተሰራው በበረከት</p>
        </footer>
    </div>

</body>
</html>
